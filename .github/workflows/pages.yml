name: Live page

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "contracts/demo/run.json"
      - "contracts/deployed/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r live/. _site/
          cp contracts/deployed/base-sepolia.json _site/deployment.json
          cp contracts/demo/run.json _site/run.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
