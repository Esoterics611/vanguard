  - "II. Getting Started":
    - "Prerequisites": getting-started/prerequisites.md
    - "Wallet Setup": getting-started/wallet-setup.md
    - "Acquiring Testnet ETH": getting-started/testnet-eth.md
    - "Connecting to the Protocol": getting-started/connecting.md
    - "Your First Enlistment": getting-started/first-enlistment.md

  - "III. The Rank System":
